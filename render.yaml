services:
  - type: web
    name: vidoreader
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_COMPARISON_MODEL
        value: gpt-4o
      - key: DATA_DIR
        value: /app/deploy/data
      - key: TOKENIZERS_PARALLELISM
        value: false
    autoDeploy: true
